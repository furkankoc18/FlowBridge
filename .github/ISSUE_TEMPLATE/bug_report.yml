name: Bug report
description: Report a reproducible FlowBridge problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include exact steps and expected behavior. Never include pairing keys or personal data.
    validations:
      required: true
  - type: input
    attributes:
      label: Source and target versions
      placeholder: macOS 15.6 → Windows 11 24H2
    validations:
      required: true
  - type: input
    attributes:
      label: FlowBridge version
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    attributes:
      label: Displays and scaling
      placeholder: Mac 2560x1600; Windows 4K at 150%
  - type: dropdown
    attributes:
      label: Connection
      options: [Wi-Fi, Ethernet, Mixed]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Mouse model, logs without identifiers, screenshots, or a screen recording.
