[workspace]
members = [
    "crates/flowbridge-core",
    "crates/flowbridge-protocol",
    "crates/flowbridge-transport",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
